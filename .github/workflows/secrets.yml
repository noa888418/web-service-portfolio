name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks with checksum verification
        run: python3 scripts/secrets.py install
      - name: Scan fetched Git history (including PR history)
        run: python3 scripts/secrets.py history
      - name: Scan checked-out files
        run: python3 scripts/secrets.py files
