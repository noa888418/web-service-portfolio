name: Frontend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate temporary infrastructure values without output
        run: python3 scripts/setup_local.py
      - name: Build pinned non-root frontend
        run: docker compose --profile frontend build frontend
      - name: Type check, lint, mock tests, build and dependency audit
        run: docker compose --profile frontend run --rm --no-deps frontend npm run check
      - name: Build real browser and isolated API
        run: docker compose -f compose.e2e.yaml --profile e2e build e2e-api browser
      - name: Start isolated PostgreSQL, normal Laravel and Vite
        run: docker compose -f compose.e2e.yaml --profile e2e up -d --wait frontend
      - name: Real browser login, request creation and scoped detail verification in isolated DB
        run: docker compose -f compose.e2e.yaml --profile e2e run --rm browser
      - name: Stop isolated test resources
        if: always()
        run: docker compose -f compose.e2e.yaml --profile e2e down
