name: Users and authentication verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  users:
    name: Users PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate temporary local credentials without logging values
        run: python3 scripts/setup_local.py
      - name: Verify private credential generation without printing values
        run: python3 scripts/test_demo_setup.py
      - name: Build pinned PHP runtime and Composer tooling
        run: docker compose --profile tools build app composer
      - name: Audit locked PHP dependencies
        run: docker compose --profile tools run --rm composer audit --locked --no-interaction
      - name: Start isolated PostgreSQL
        run: docker compose --profile test up -d --wait test-db
      - name: Test existing users constraints
        run: docker compose --profile test run --rm test php vendor/bin/phpunit --testsuite Users
      - name: Test authentication via real HTTP and PostgreSQL
        run: docker compose --profile test run --rm test php vendor/bin/phpunit --testsuite Authentication
      - name: Test request creation and scoped reads
        run: docker compose --profile test run --rm test php vendor/bin/phpunit --testsuite Requests
      - name: Test assignment and status concurrency separately
        run: docker compose --profile test run --rm test php vendor/bin/phpunit --testsuite Workflow
      - name: Test comments and completion concurrency
        run: docker compose --profile test run --rm test php vendor/bin/phpunit --testsuite Comments
      - name: Test guarded demo seed and normal HTTP entrypoint
        run: docker compose --profile test run --rm test php vendor/bin/phpunit --testsuite Demo
      - name: Repeat all suites after demo verification
        run: docker compose --profile test run --rm test
      - name: Stop containers
        if: always()
        run: docker compose --profile test down
