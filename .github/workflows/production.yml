name: Production containers
on: [push, pull_request]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build runtime images and isolated verifier
        run: python3 scripts/production.py build
      - name: Generate isolated runtime values and explicitly prepare guarded test DB
        run: |
          python3 scripts/production.py setup
          python3 scripts/production.py prepare
      - name: Trusted HTTPS and production PHP-FPM workflow
        run: python3 scripts/production.py test
      - name: Final images vulnerability gate, SBOM and image policy
        run: python3 scripts/production.py scan
      - name: Retain only non-sensitive image reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-reports
          path: .local/production-reports/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Stop isolated resources, retain data
        if: always()
        run: python3 scripts/production.py stop
