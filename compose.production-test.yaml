name: it-requests-production-tests
services:
  test-db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    env_file: .local/production/database.env
    volumes:
      - production_test_data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d portfolio_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  prepare:
    image: it-requests-php:production
    profiles: [tools]
    env_file: .local/production/runtime.env
    environment: {APP_ENV: testing}
    entrypoint: [php, /verification/prepare.php]
    read_only: true
    user: "${PRODUCTION_UID:-10001}:${PRODUCTION_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, "/app/bootstrap/cache:uid=${PRODUCTION_UID:-10001},gid=${PRODUCTION_GID:-10001},mode=0700", "/app/storage:uid=${PRODUCTION_UID:-10001},gid=${PRODUCTION_GID:-10001},mode=0700"]
    volumes:
      - ./.local/production:/run/production
      - ./docker/verification/prepare.php:/verification/prepare.php:ro
      - ./backend/tests/Support/TestDatabaseGuard.php:/verification/TestDatabaseGuard.php:ro
    networks: [database]
    depends_on:
      test-db: {condition: service_healthy}
  php:
    image: it-requests-php:production
    env_file: .local/production/runtime.env
    entrypoint: [/bin/sh, /verification/fpm.sh]
    read_only: true
    user: "${PRODUCTION_UID:-10001}:${PRODUCTION_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, "/app/bootstrap/cache:uid=${PRODUCTION_UID:-10001},gid=${PRODUCTION_GID:-10001},mode=0700", "/app/storage:uid=${PRODUCTION_UID:-10001},gid=${PRODUCTION_GID:-10001},mode=0700"]
    volumes:
      - ./.local/production/schema:/run/schema:ro
      - ./docker/verification/fpm.sh:/verification/fpm.sh:ro
    networks: [application, database]
    depends_on:
      test-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 2s
      timeout: 3s
      retries: 30
  nginx:
    image: it-requests-nginx:production
    environment: {PHP_UPSTREAM: "php:9000"}
    read_only: true
    user: "${PRODUCTION_UID:-10001}:${PRODUCTION_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=${PRODUCTION_UID:-10001},gid=${PRODUCTION_GID:-10001},mode=0700"]
    volumes:
      - ./.local/production/tls:/run/tls:ro
      - ./.local/production/tls/listener.conf:/etc/nginx/portfolio-tls.conf:ro
    ports: ["127.0.0.1:8443:8443"]
    networks: [application, entry]
    depends_on:
      php: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
  browser:
    image: it-requests-production-verifier:local
    profiles: [tools]
    user: "${PRODUCTION_UID:-10001}:${PRODUCTION_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:nginx
    shm_size: 512mb
    volumes:
      - ./.local/production/credentials.json:/run/production/credentials.json:ro
      - ./.local/production/tls/ca.crt:/run/production/ca.crt:ro
    depends_on:
      nginx: {condition: service_healthy}
volumes:
  production_test_data: {}
networks:
  database: {internal: true}
  application: {internal: true}
  entry: {}
