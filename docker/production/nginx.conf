worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error records can contain raw request URLs; suppress them here.
# Access status/timing and sanitized Laravel exception types are the runtime logs.
error_log /dev/null;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format minimal '$request_method $status $request_time';
  access_log /dev/stdout minimal;
  client_body_temp_path /tmp/client;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 64k;
  upstream application { server __PHP_UPSTREAM__; }
  server {
    listen 8080;
    include /etc/nginx/portfolio-tls.conf;
    root /srv/www;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz {
      access_log off;
      include /etc/nginx/portfolio-fastcgi.conf;
      fastcgi_param SCRIPT_NAME /fpm-ping;
      fastcgi_param SCRIPT_FILENAME /fpm-ping;
    }
    location = /login {
      error_page 418 = @laravel;
      if ($request_method != GET) { return 418; }
      add_header Cache-Control 'private, no-store' always;
      try_files /index.html =404;
    }
    location = /logout { include /etc/nginx/portfolio-fastcgi.conf; }
    location = /sanctum/csrf-cookie { include /etc/nginx/portfolio-fastcgi.conf; }
    location = /api { include /etc/nginx/portfolio-fastcgi.conf; }
    location ^~ /api/ { include /etc/nginx/portfolio-fastcgi.conf; }
    location @laravel { include /etc/nginx/portfolio-fastcgi.conf; }
    location ~ (^|/)\. { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location /assets/ {
      limit_except GET { deny all; }
      add_header Cache-Control 'public, max-age=31536000, immutable';
      try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control 'private, no-store' always; }
    location / {
      limit_except GET { deny all; }
      add_header Cache-Control 'private, no-store' always;
      try_files $uri /index.html;
    }
  }
}
