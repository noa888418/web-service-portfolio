[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no
[www]
listen = 0.0.0.0:9000
pm = static
pm.max_children = 2
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 30s
security.limit_extensions = .php
ping.path = /fpm-ping
ping.response = ok
